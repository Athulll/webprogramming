<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopCraft catalog backed by a PHP and MySQL REST API.">
  <title>ShopCraft</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <div class="container header-container">
      <a href="#" class="brand" id="brand-link">
        <span class="brand-name">ShopCraft</span>
      </a>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search products..." maxlength="200" autocomplete="off">
        <button id="clear-search-btn" class="clear-btn" style="display: none;" title="Clear search">&times;</button>
      </div>

      <div class="bookings-indicator" id="bookings-indicator">
        <span>Booked:</span>
        <strong id="booked-count">0</strong>
      </div>
    </div>
  </header>

  <nav class="category-nav" aria-label="Product Categories">
    <div class="container">
      <div class="category-list" id="category-list">
        <button class="cat-btn active" data-category="all">All</button>
      </div>
    </div>
  </nav>

  <main class="main container">
    <section class="admin-panel" aria-label="Catalog management">
      <div class="admin-toolbar">
        <form id="login-form" class="login-form">
          <label>
            <span>Admin username</span>
            <input id="login-username" name="username" type="text" autocomplete="username" required>
          </label>
          <label>
            <span>Password</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="btn-primary" type="submit">Sign in to manage items</button>
        </form>

        <div id="admin-actions" class="admin-actions" hidden>
          <p>Signed in: <strong id="admin-name"></strong></p>
          <button id="new-item-btn" class="btn-primary" type="button">Add item</button>
          <button id="logout-btn" class="btn-secondary" type="button">Sign out</button>
        </div>
      </div>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>

      <div id="item-form-panel" class="item-form-panel" hidden>
        <h2 id="item-form-title">Add catalog item</h2>
        <form id="item-form" class="item-form">
          <input id="item-id" name="id" type="hidden">
          <label>
            <span>Name</span>
            <input id="item-name" name="name" type="text" maxlength="150" required>
          </label>
          <label>
            <span>Category</span>
            <select id="item-category" name="category_id" required></select>
          </label>
          <label>
            <span>Price (₹)</span>
            <input id="item-price" name="price" type="number" min="0" max="99999999.99" step="0.01" required>
          </label>
          <label>
            <span>Stock</span>
            <input id="item-stock" name="stock" type="number" min="0" max="4294967295" step="1" required>
          </label>
          <label class="item-form-wide">
            <span>Description</span>
            <textarea id="item-description" name="description" maxlength="10000" rows="3"></textarea>
          </label>
          <label class="item-form-wide">
            <span>Image URL (optional)</span>
            <input id="item-image" name="image_url" type="url" maxlength="2048">
          </label>
          <div class="item-form-actions item-form-wide">
            <button class="btn-primary" id="save-item-btn" type="submit">Save item</button>
            <button class="btn-secondary" id="cancel-item-btn" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <section class="controls-bar">
      <div class="controls-info">
        <h1 class="page-title" id="page-title">All Products</h1>
        <span class="item-count" id="item-count">Loading...</span>
      </div>

      <div class="controls-actions">
        <label for="sort-select" class="sort-label">Sort by:</label>
        <select id="sort-select" class="sort-select">
          <option value="default">Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
        </select>
      </div>
    </section>

    <section class="products-section">
      <div class="data-status" id="data-status" role="status" aria-live="polite" hidden>
        <p id="data-status-message">Loading products...</p>
        <button id="retry-load-btn" class="btn btn-secondary" type="button" hidden>Try again</button>
      </div>

      <div class="product-grid" id="product-grid">
      </div>

      <div class="no-results" id="no-results" style="display: none;">
        <h3>No products found</h3>
        <p id="no-results-text">Try adjusting your search or category filter.</p>
        <button id="reset-filter-btn" class="btn btn-secondary">Reset Filters</button>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 ShopCraft.</p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>

</html>
